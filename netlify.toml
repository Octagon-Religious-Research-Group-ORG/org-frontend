[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
# Vite fingerprints everything under /assets/ (e.g. about-DFilPrf1.webp), so a changed
# file always gets a new URL — safe to cache for a year and skip revalidation.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
