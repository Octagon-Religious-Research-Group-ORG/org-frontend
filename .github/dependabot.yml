version: 2
updates:
  # One grouped pull request a month instead of one per package: every merge into main
  # rebuilds the live site on Netlify (15 of the 300 monthly credits). Security fixes are
  # grouped too (repo setting "Dependabot security updates" opens them as they appear).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all-updates:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
